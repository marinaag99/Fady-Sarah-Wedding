<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Fady & Sarah | Wedding Invitation</title>

<style>

/* ================================
   PAGE
================================ */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    min-height: 100%;
    margin: 0;
    padding: 0;
    background: #eee4d2;
}

body {
    overflow-x: hidden;
}


/* ================================
   MAIN INVITATION
================================ */

.invitation {
    position: relative;

    width: 100%;

    max-width: 1024px;

    margin: 0 auto;

    line-height: 0;
}


/* ================================
   EXACT ORIGINAL IMAGE
================================ */

.invitation-image {

    display: block;

    width: 100%;

    height: auto;

    margin: 0;

    padding: 0;

}


/* ================================
   LIVE COUNTDOWN
================================ */

/*
   IMPORTANT:
   No background is used here.
   The original countdown boxes from
   the artwork remain visible.
*/

.live-countdown {

    position: absolute;

    left: 19.3%;

    top: 67.55%;

    width: 61.4%;

    height: 4.8%;

    display: flex;

    align-items: center;

    justify-content: space-between;

    z-index: 5;

    pointer-events: none;

}


.count-number {

    width: 23%;

    height: 100%;

    display: flex;

    align-items: center;

    justify-content: center;

    background: transparent;

    color: #5e5138;

    font-family: Georgia, "Times New Roman", serif;

    font-size: clamp(
        24px,
        4.1vw,
        42px
    );

    font-weight: 400;

    line-height: 1;

    text-align: center;

}


/* ================================
   CHURCH LOCATION
================================ */

.church-button {

    position: absolute;

    left: 18.2%;

    top: 60.05%;

    width: 27.1%;

    height: 4.1%;

    display: block;

    background: transparent;

    border: 0;

    z-index: 10;

    cursor: pointer;

}


/* ================================
   HOTEL LOCATION
================================ */

.hotel-button {

    position: absolute;

    left: 54.7%;

    top: 60.05%;

    width: 27.1%;

    height: 4.1%;

    display: block;

    background: transparent;

    border: 0;

    z-index: 10;

    cursor: pointer;

}


/* ================================
   RSVP
================================ */

.rsvp-button {

    position: absolute;

    left: 37%;

    top: 80.8%;

    width: 26%;

    height: 5.5%;

    display: block;

    background: transparent;

    border: 0;

    z-index: 10;

    cursor: pointer;

}


/* ================================
   TAP TO OPEN
================================ */

/*
   This button is positioned over the
   TAP TO OPEN text in the artwork.
*/

.open-button {

    position: absolute;

    left: 35%;

    top: 34.3%;

    width: 30%;

    height: 5%;

    background: transparent;

    border: 0;

    z-index: 10;

    cursor: pointer;

}


/* ================================
   MOBILE
================================ */

@media (max-width: 600px) {

    .live-countdown {

        left: 19.3%;

        width: 61.4%;

        top: 67.55%;

    }

    .count-number {

        font-size: 17px;

    }

    .church-button {

        left: 18.2%;

        top: 60.05%;

        width: 27.1%;

        height: 4.1%;

    }

    .hotel-button {

        left: 54.7%;

        top: 60.05%;

        width: 27.1%;

        height: 4.1%;

    }

    .rsvp-button {

        left: 37%;

        top: 80.8%;

        width: 26%;

        height: 5.5%;

    }

}

</style>

</head>


<body>


<div class="invitation">


    <!-- =================================
         EXACT WEDDING ARTWORK
    ================================== -->

    <img
        src="wedding-design.png"
        class="invitation-image"
        alt="Fady and Sarah Wedding Invitation"
    >



    <!-- =================================
         LIVE COUNTDOWN
    ================================== -->

    <div class="live-countdown">

        <div
            class="count-number"
            id="days">
            0
        </div>

        <div
            class="count-number"
            id="hours">
            0
        </div>

        <div
            class="count-number"
            id="minutes">
            0
        </div>

        <div
            class="count-number"
            id="seconds">
            0
        </div>

    </div>



    <!-- =================================
         CHURCH LOCATION
    ================================== -->

    <a
        href="https://maps.app.goo.gl/Aog3oVXVGiwb47Cz9?g_st=iw"

        target="_blank"

        class="church-button"

        aria-label="Open church location">
    </a>



    <!-- =================================
         HOTEL LOCATION
    ================================== -->

    <a
        href="https://maps.app.goo.gl/ARrpiHBE5yC5Y9dr8?g_st=iw"

        target="_blank"

        class="hotel-button"

        aria-label="Open reception location">
    </a>



    <!-- =================================
         RSVP
    ================================== -->

    <a
        href="https://forms.gle/RbQumMt9hYUPtmz8A"

        target="_blank"

        class="rsvp-button"

        aria-label="RSVP">
    </a>



    <!-- =================================
         TAP TO OPEN
    ================================== -->

    <button
        class="open-button"

        onclick="openInvitation()"

        aria-label="Open invitation">
    </button>


</div>



<script>


/* ================================
   TAP TO OPEN
================================ */

function openInvitation() {

    /*
       The invitation is already displayed
       as one complete design.

       Tapping "TAP TO OPEN" simply moves
       the guest smoothly toward the
       wedding details.
    */

    window.scrollTo({

        top: window.innerHeight * 0.35,

        behavior: "smooth"

    });

}


/* ================================
   WEDDING COUNTDOWN
================================ */

const weddingDate =
    new Date(
        "2026-10-10T18:00:00+03:00"
    ).getTime();


function updateCountdown() {

    const now =
        new Date().getTime();


    let distance =
        weddingDate - now;


    if (distance < 0) {

        distance = 0;

    }


    const days =
        Math.floor(
            distance /
            (1000 * 60 * 60 * 24)
        );


    const hours =
        Math.floor(
            (
                distance %
                (1000 * 60 * 60 * 24)
            )
            /
            (1000 * 60 * 60)
        );


    const minutes =
        Math.floor(
            (
                distance %
                (1000 * 60 * 60)
            )
            /
            (1000 * 60)
        );


    const seconds =
        Math.floor(
            (
                distance %
                (1000 * 60)
            )
            /
            1000
        );


    document.getElementById("days")
        .textContent = days;


    document.getElementById("hours")
        .textContent = hours;


    document.getElementById("minutes")
        .textContent = minutes;


    document.getElementById("seconds")
        .textContent = seconds;

}


updateCountdown();

setInterval(
    updateCountdown,
    1000
);

</script>


</body>

</html>
