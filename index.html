<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fady & Sarah | Wedding Invitation</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    min-height: 100%;
    background: #d8cbb7;
}

body {
    display: flex;
    justify-content: center;
}

/* MAIN INVITATION */

.invitation {
    position: relative;
    width: 100%;
    max-width: 1536px;
}

/* EXACT INVITATION IMAGE */

.invitation-image {
    display: block;
    width: 100%;
    height: auto;
}


/* =====================================
   INVISIBLE INTERACTIVE BUTTONS
===================================== */


/* CHURCH LOCATION */

.map-church {

    position: absolute;

    left: 18%;
    top: 57.2%;

    width: 27%;
    height: 3.5%;

    display: block;

    background: transparent;

    cursor: pointer;
}


/* HOTEL LOCATION */

.map-hotel {

    position: absolute;

    left: 55%;
    top: 57.2%;

    width: 27%;
    height: 3.5%;

    display: block;

    background: transparent;

    cursor: pointer;
}


/* RSVP */

.rsvp {

    position: absolute;

    left: 37%;
    top: 77%;

    width: 26%;
    height: 4%;

    display: block;

    background: transparent;

    cursor: pointer;
}


/* MOBILE */

@media (max-width: 600px) {

    .invitation {
        width: 100%;
    }

}

</style>

</head>


<body>


<div class="invitation">


    <!-- EXACT WEDDING DESIGN -->

    <img
        src="wedding-design.png"
        class="invitation-image"
        alt="Fady and Sarah Wedding Invitation"
    >


    <!-- CHURCH LOCATION -->

    <a
        class="map-church"
        href="https://maps.app.goo.gl/Aog3oVXVGiwb47Cz9?g_st=iw"
        target="_blank"
        aria-label="Open church location">
    </a>


    <!-- HOTEL LOCATION -->

    <a
        class="map-hotel"
        href="https://maps.app.goo.gl/ARrpiHBE5yC5Y9dr8?g_st=iw"
        target="_blank"
        aria-label="Open hotel location">
    </a>


    <!-- RSVP -->

    <a
        class="rsvp"
        href="https://forms.gle/RbQumMt9hYUPtmz8A"
        target="_blank"
        aria-label="RSVP">
    </a>


</div>


</body>

</html>
